function decodeAI(raw){

function swap(i){const old=s.plan[i], candidates=recipes.map((r,id)=>({...r,id})).filter(r=>r.type===old.meal&&r.id!==old.id&&allowed(r)).map(r=>{const p=s.plan.map((x,j)=>i===j?{...x,id:r.id}:x);return{p,c:total(p),repeats:p.filter(x=>x.id===r.id).length}}).sort((a,b)=>(a.c>s.budget)-(b.c>s.budget)||a.repeats-b.repeats||a.c-b.c);if(!candidates.length){alert('Других подходящих блюд нет. Измените ограничения.');return}if(candidates[0].c>s.budget&&!confirm('Замена выйдет за бюджет. Продолжить?'))return;s.plan=candidates[0].p;s.checked=[];render()}
app.addEventListener('click',async e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,k=b.dataset.key,v=b.dataset.val;if(aiBusy)return;if(a==='ai-connect'){const key=document.querySelector('#ai-key')?.value.trim();if(!key){aiError='Введите ключ.';render();return}aiKey=key;aiError='';render();return}if(a==='ai-clear'){aiKey='';aiError='';render();return}if(a==='local-generate'){let err=generate();if(err){s.error=err;render()}else window.scrollTo(0,0);return}if(a==='pick'){if(Array.isArray(s[k])){let x=k==='days'?Number(v):v;if(k==='allergies'&&x==='none')s[k]=[];else s[k]=s[k].includes(x)?s[k].filter(y=>y!==x):[...s[k],x]}else s[k]=v;render()}if(a==='count'){s[k]=Math.min(20,Math.max(0,s[k]+Number(v)));render()}if(a==='next'){if(s.step<12){s.step++;s.search='';render();window.scrollTo(0,0)}else{await generateAI()}}if(a==='back'){if(s.view==='recipe')s.view='plan';else if(s.view==='quiz')s.step=Math.max(0,s.step-1);else s.view='plan';s.search='';render();window.scrollTo(0,0)}if(a==='view'){s.view=v;if(v==='quiz')s.step=1;render();window.scrollTo(0,0)}if(a==='recipe'){detail=Number(v);s.view='recipe';render();window.scrollTo(0,0)}if(a==='swap'){swap(Number(v));if(s.source==='ai'){s.aiNote='План составлен ИИ; отдельные блюда можно заменять локально.';render()}}if(a==='regenerate'){if(s.source==='ai'||aiKey)await generateAI();else{let err=generate();if(err)alert(err)}}if(a==='clearchecks'){s.checked=[];render()}if(a==='copy'){const txt=`Список покупок · ${s.store}\n${basket().map(x=>`${s.checked.includes(x.k)?'✓':'□'} ${x.name} — ${qty(x.buy,x.unit)}`).join('\n')}\nОриентировочно ${money(total())}`;try{await navigator.clipboard.writeText(txt);b.textContent='Скопировано'}catch{prompt('Скопируйте список:',txt)}}});
app.addEventListener('input',e=>{if(e.target.id==='search'){s.search=e.target.value;document.querySelector('#foodchips').innerHTML=foodChips(s.step===10?'dislikes':'pantry')}if(['budgetrange','budgetnum'].includes(e.target.id)){let n=Number(e.target.value);s.budget=Math.max(100,Math.min(100000,n||100));if(e.target.id==='budgetrange')document.querySelector('#budgetnum').value=s.budget;else document.querySelector('#budgetrange').value=s.budget;document.querySelector('#per').textContent=money(s.budget/Math.max(1,slots()*portions()));save()}});
app.addEventListener('change',e=>{if(e.target.dataset.check){let k=e.target.dataset.check;s.checked=e.target.checked?[...new Set([...s.checked,k])]:s.checked.filter(x=>x!==k);render()}});render();
</script></body></html>
