function extraAllergyConflict(x){const n=norm(x.name);const terms={'Молоко':/молок|творог|йогурт|сыр|сливк|кефир/,'Яйца':/яйц|яич/,'Глютен':/пшениц|хлеб|макарон|мук|печенье|печеньк|овсян/,'Рыба':/рыб|минтай|лосос|семг|треск/,'Орехи':/орех|миндал|фундук|кешью|фисташ/,'Арахис':/арахис/,'Соя':/соя|соев/,'Кунжут':/кунжут|тахин/,'Морепродукты':/кревет|мидии|кальмар|краб/};return s.allergies.some(a=>terms[a]?.test(n))}

function basket(plan=s.plan){let out={};for(const x of extraItems())out[x.id]=x.qty;for(const p of plan){const r=recipes[p.id];if(!r)continue;for(const [k,v] of Object.entries(r.ingredients))out[k]=(out[k]||0)+v*portions()}return Object.entries(out).filter(([k])=>food[k]&&(!s.pantry.includes(k)||k.startsWith('extra_'))).map(([k,qty])=>{const [name,rate,cat,pack,unit='г']=food[k];const product=selectedProduct(k),size=product?product.pack:pack;const packs=Math.ceil(qty/size),buy=packs*size,price=product?packs*product.price:rate===null?null:buy*rate/(unit==='шт'?1:1000);return{k,name:product?product.name:name,qty,buy,unit,cat,price,packs,product}})}

function portionIssue(r){
