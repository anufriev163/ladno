function allowed(r){const keys=Object.keys(r.ingredients);if(keys.some(k=>nameBlocked(food[k]?.[0]||k))||nameBlocked(r.name)||nameBlocked(r.method||''))return false;if(keys.some(k=>s.dislikes.includes(k)||s.allergies.some(a=>(allergens[a]||[]).includes(k))))return false;if(s.diet==='Веганское'&&keys.some(k=>['egg','chicken','fish','milk','curd','yogurt','cheese'].includes(k)))return false;if(s.diet==='Вегетарианское'&&keys.some(k=>['chicken','fish'].includes(k)))return false;if(s.diet==='Без мяса'&&keys.includes('chicken'))return false;if(s.diet==='Низкоуглеводное'&&keys.some(k=>['oats','rice','buck','pasta','potato','flour','bread','banana','apple'].includes(k)))return false;if(r.equipment){if(!r.equipment.every(k=>s.equipment.includes(k)))return false}else if(!s.equipment.includes('Плита')&&r.time>5)return false;return true}
function basket(plan=s.plan){let out={};for(const x of extraItems())out[x.id]=x.qty;for(const p of plan){const r=recipes[p.id];if(!r)continue;for(const [k,v] of Object.entries(r.ingredients))out[k]=(out[k]||0)+v*portions()}return Object.entries(out).filter(([k])=>food[k]&&(!s.pantry.includes(k)||k.startsWith('extra_'))).map(([k,qty])=>{const [name,rate,cat,pack,unit='г']=food[k];const product=selectedProduct(k),size=product?product.pack:pack;const packs=Math.ceil(qty/size),buy=packs*size,price=product?packs*product.price:rate===null?null:buy*rate/(unit==='шт'?1:1000);return{k,name:product?product.name:name,qty,buy,unit,cat,price,packs,product}})}
const total=(p=s.plan)=>basket(p).reduce((a,b)=>a+(b.price??0),0);
function preferenceScore(r){const keys=Object.keys(r.ingredients);let score=keys.filter(k=>s.likes.includes(k)||s.customLikes.some(n=>norm(food[k]?.[0])===norm(n))).length*45;if(['Набор мышечной массы','Спортивное питание','Восстановление после тренировок'].includes(s.goal)||s.diet==='Высокобелковое')score+=keys.filter(k=>['egg','chicken','fish','curd','lentil','beans','yogurt'].includes(k)).length*12;if(s.diet==='Высокоуглеводное')score+=keys.filter(k=>['oats','rice','buck','potato','pasta','lentil','beans','apple','banana','bread'].includes(k)).length*12;if(['Без ограничений','Сбалансированное','Высокобелковое','Высокоуглеводное'].includes(s.diet)&&['Обед','Ужин'].includes(r.type)&&keys.some(k=>['chicken','fish'].includes(k)))score+=75;return score}

function auditPlan(plan,list=recipes,full=true){
 const totals={},byDay={},seen=new Set(),caps=quantityLimits();
 for(const p of plan){
  const r=list[p.id];if(!r||!s.days.includes(p.day)||!s.meals.includes(p.meal)||r.type!==p.meal)return 'Не найден подходящий рецепт';
  const slot=p.day+'|'+p.meal;if(seen.has(slot))return 'Повтор приёма пищи';seen.add(slot);
  const err=portionIssue(r);if(err)return err;if(!allowed(r))return 'Блюдо не соответствует ограничениям';
  const day=byDay[p.day]||(byDay[p.day]={});
  for(const [k,v] of Object.entries(r.ingredients)){
   totals[k]=(totals[k]||0)+v;day[k]=(day[k]||0)+v;
   if(totals[k]>(caps[k]??Infinity)||day[k]>(dailyGuard[k]??Infinity))return 'Слишком много продукта «'+food[k][0]+'» на человека';
  }
 }
 if(full&&plan.length!==slots())return 'Меню заполнено не полностью';if(full&&['Без ограничений','Сбалансированное','Высокобелковое','Высокоуглеводное'].includes(s.diet)&&s.days.length>=4&&s.meals.some(m=>['Обед','Ужин'].includes(m))&&list.some(r=>allowed(r)&&s.meals.includes(r.type)&&('chicken' in r.ingredients||'fish' in r.ingredients))){const n=plan.filter(p=>('chicken' in list[p.id].ingredients||'fish' in list[p.id].ingredients)).length;if(n<Math.ceil(s.days.length/2))return 'Мало разнообразных блюд с мясом или рыбой'}return '';

 return Object.values(names).reduce((a,n)=>a+Math.max(0,n-1)**2*140,0)+Object.entries(keys).reduce((a,[k,n])=>a+(k==='oil'||k==='onion'?0:Math.max(0,n-Math.ceil(s.days.length*.7))**2*12),0)
}

function generate(){const conflict=extraItems().find(x=>nameBlocked(x.name)||s.dislikes.some(k=>norm(food[k]?.[0])===norm(x.name)));if(conflict)return 'Продукт «'+conflict.name+'» одновременно указан в исключениях и постоянных покупках. Измените один из списков.';const pool=recipes.map((r,id)=>({...r,id})).filter(allowed);for(const m of s.meals)if(!pool.some(r=>r.type===m)){return 'Нет подходящих рецептов для «'+m+'». Измените ограничения или набор приёмов пищи.'}let best=null,bestScore=Infinity,lowest=Infinity;

}
if(!best)return Number.isFinite(lowest)?'Не удалось уложиться в '+money(s.budget)+'. Самый доступный найденный вариант — '+money(lowest)+'. Измените бюджет или состав покупок.':'Не удалось подобрать меню с этими ограничениями. Измените набор блюд или продуктов.';

 '<details class="info-details"><summary>О меню</summary><p>'+(s.source==='local'?'Использован базовый подбор рецептов. ':'')+'План не проверен на индивидуальные нормы питания. Для детей и специальных диет учитывайте возраст и рекомендации специалиста.</p></details></main>'+navigation()
}
function shopping(){
 if(s.plan.length&&(auditPlan(s.plan)||total()>s.budget)){reviewView('Список покупок');return}
 if(!s.plan.length){emptyView('Покупки','Здесь появится ваш список продуктов.');return}
 const b=basket(),cats=[...new Set(b.map(x=>x.cat))],done=b.filter(x=>s.checked.includes(x.k)).length;
 const budgetText=missingPrices()?'У '+missingPrices()+' товаров нет цены':total()>s.budget?'Выше бюджета на '+money(total()-s.budget):'Остаток бюджета '+money(s.budget-total());
 app.innerHTML=head(false)+'<main class="tab-content"><h1>Список покупок</h1><div class="summary"><small>Ориентировочные цены</small><div class="amount">'+priceTotal()+'</div><p class="budget-note">'+budgetText+'</p></div>'+
 '<div class="section-heading checklist-heading"><h2>Продукты</h2><span class="check-count">'+done+' из '+b.length+' куплено</span></div>'+
 cats.map(cat=>'<section class="grocery-group"><h3>'+esc(cat)+'</h3>'+b.filter(x=>x.cat===cat).map(x=>'<div class="grocery '+(s.checked.includes(x.k)?'done':'')+'"><label class="grocery-check"><input type="checkbox" data-check="'+esc(x.k)+'" '+(s.checked.includes(x.k)?'checked':'')+'><span><b class="itemname">'+esc(x.name)+'</b><small class="quantity">'+qty(x.buy,x.unit)+(x.product?' · '+x.packs+' уп.':'')+'</small></span></label><span class="price">'+(x.price===null?'Нет цены':money(x.price))+'</span>'+(x.product?.url?'<a class="product-link" href="'+esc(x.product.url)+'">Открыть товар →</a>':'')+'</div>').join('')+'</section>').join('')+
 orderPanel()+'<button class="secondary copy-button" data-act="copy">Скопировать список</button></main>'+navigation()
}
const qty=(n,u)=>n>=1000&&u!=='шт'?`${(n/1000).toLocaleString('ru-RU',{maximumFractionDigits:2})} ${u==='мл'?'л':'кг'}`:`${n} ${u}`;
let detail=0;function recipe(){const p=s.plan[detail],r=recipes[p.id];app.innerHTML=head()+`<main><div class="eyebrow">${p.meal} · ${r.time} минут</div><h1>${r.name}</h1><p>На ${portions()} порций</p><h2>Ингредиенты</h2><div class="panel">${Object.entries(r.ingredients).map(([k,v])=>`<div class="row" style="padding:8px 0"><span>${food[k][0]}${s.pantry.includes(k)?' · дома':''}</span><b>${qty(v*portions(),food[k][4]||'г')}</b></div>`).join('')}</div><h2>Приготовление</h2><ol class="steps">${r.method.split('. ').map(t=>`<li>${esc(t.replace(/\.$/,''))}.</li>`).join('')}</ol><button class="secondary" data-act="view" data-val="plan">Вернуться к меню</button></main>`}
function settingsScreen(){app.innerHTML=head(false)+'<main class="tab-content"><h1>настройки</h1><button class="settings-row" data-act="view" data-val="quiz">изменить анкету <span>›</span></button><button class="settings-row" data-act="view" data-val="profile">профиль питания <span>›</span></button></main>'+navigation()}
function profileScreen(){
 const p=s.nutritionProfile;
 app.innerHTML=head(true)+'<main class="tab-content"><h1>профиль питания</h1><p>необязательные данные взрослого пользователя для подбора меню. не медицинская диагностика.</p><div class="extra-form"><label>возраст, лет<input class="extraField" id="profile-age" type="number" min="18" max="120" placeholder="например, 30" value="'+esc(p.age??'')+'"></label><label>рост, см<input class="extraField" id="profile-height" type="number" min="100" max="250" value="'+esc(p.height??'')+'"></label><label>вес, кг<input class="extraField" id="profile-weight" type="number" min="30" max="350" step="0.1" value="'+esc(p.weight??'')+'"></label><label>образ жизни<select class="extraField" id="profile-activity">'+['не указано','малоподвижный','умеренно активный','активный','регулярные тренировки'].map(x=>'<option '+(p.activity===x?'selected':'')+'>'+x+'</option>').join('')+'</select></label><label class="profile-consent"><input type="checkbox" id="profile-share" '+(p.share?'checked':'')+'> разрешаю передавать эти данные сервису составления меню</label><button class="primary" style="margin-top:20px" data-act="profile-save">сохранить</button></div></main>'+navigation()
}
function saveProfile(){const read=(id,min,max)=>{const v=document.querySelector(id).value.trim();if(!v)return null;const n=Number(v);if(!Number.isFinite(n)||n<min||n>max)throw Error('проверьте введённые данные');return n};try{s.nutritionProfile={age:read('#profile-age',18,120),height:read('#profile-height',100,250),weight:read('#profile-weight',30,350),activity:document.querySelector('#profile-activity').value,share:document.querySelector('#profile-share').checked};if(!s.nutritionProfile.age)s.nutritionProfile.share=false;s.view='settings';render()}catch(e){alert(e.message)}}
function render(){save();if(aiBusy&&['plan','shopping'].includes(s.view)){generationScreen();return}if(generationError&&['plan','shopping'].includes(s.view)){generationFailure();return}if(s.view==='profile'){profileScreen();return}if(s.view==='settings'){settingsScreen();return}if(s.view==='extras'){extrasScreen();return}if(s.view==='catalog'){s.view='settings';settingsScreen();return}if(s.view==='plan')plan();else if(s.view==='shopping')shopping();else if(s.view==='recipe'&&s.plan[detail])recipe();else{s.view='quiz';quiz()}}
function swap(i){const old=s.plan[i], candidates=recipes.map((r,id)=>({...r,id})).filter(r=>r.type===old.meal&&r.id!==old.id&&allowed(r)).map(r=>{const p=s.plan.map((x,j)=>i===j?{...x,id:r.id}:x);return{p,c:total(p),repeats:p.filter(x=>x.id===r.id).length}}).filter(x=>!auditPlan(x.p)).sort((a,b)=>(a.c>s.budget)-(b.c>s.budget)||a.repeats-b.repeats||a.c-b.c);if(!candidates.length){alert('Других подходящих блюд нет. Измените ограничения.');return}if(candidates[0].c>s.budget){alert('Эта замена превышает бюджет.');return}s.plan=candidates[0].p;s.checked=[];render()}
app.addEventListener('click',async e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,k=b.dataset.key,v=b.dataset.val;if(aiBusy||catalogBusy)return;if(a==='extras-dismiss'){if(e.target===b)extrasAction('extras-cancel');return}if(a.startsWith('extras-')){extrasAction(a,v);return}if(a.startsWith('catalog-')){await catalogAction(a,v);return}if(a==='ai-generate'){await generateAI();return}if(a==='local-generate'){let err=generate();if(err){s.error=err;render()}else window.scrollTo(0,0);return}if(a==='pref-add'||a==='pref-remove'){preferenceAction(a,k,v);return}if(a==='pick'){if(Array.isArray(s[k])){let x=k==='days'?Number(v):v;if(k==='allergies'&&x==='none')s[k]=[];else s[k]=s[k].includes(x)?s[k].filter(y=>y!==x):[...s[k],x]}else s[k]=v;if(k==='storeChoices')s.store=s.storeChoices[0]||'';if(k==='likes')s.dislikes=s.dislikes.filter(x=>!s.likes.includes(x));if(k==='dislikes')s.likes=s.likes.filter(x=>!s.dislikes.includes(x));render()}if(a==='count'){s[k]=Math.min(20,Math.max(0,s[k]+Number(v)));render()}if(a==='exit-quiz'){s.view='settings';s.editingQuiz=false;render();return}if(a==='next'){if(s.step===10||s.step===11){const input=document.querySelector('#custom-pref');if(input?.value.trim())preferenceAction('pref-add',s.step===10?'dislikes':'likes')}if(s.step<LAST_STEP){s.step++;s.search='';render();window.scrollTo(0,0)}else{await generateAI()}}if(a==='profile-save'){saveProfile();return}if(a==='back'){if(s.view==='profile'){s.view='settings';render();return}if(s.view==='settings'){s.view=s.plan.length?'plan':'quiz';render();return}if(s.view==='extras'){extrasAction('extras-done');return}if(s.view==='catalog'){s.view='settings'}else if(s.view==='recipe')s.view='plan';else if(s.view==='quiz'){if(s.editingQuiz&&s.step<=1){s.view='settings';s.editingQuiz=false}else s.step=Math.max(0,s.step-1)}else s.view='plan';s.search='';render();window.scrollTo(0,0)}if(a==='view'){if(v==='extras'){if(s.view!=='extras'){extrasAction('extras-open')}return}s.view=v;if(v==='quiz'){s.editingQuiz=true;s.step=1;generationError='';}render();window.scrollTo(0,0)}if(a==='recipe'){detail=Number(v);s.view='recipe';render();window.scrollTo(0,0)}if(a==='swap')swap(Number(v));if(a==='regenerate'){await generateAI()}if(a==='clearchecks'){s.checked=[];render()}if(a==='copy'){const txt=`Список покупок · ${storeLabel()}\n${basket().map(x=>`${s.checked.includes(x.k)?'✓':'□'} ${x.name} — ${qty(x.buy,x.unit)}${x.product?` (${x.packs} уп.) ${x.product.url||""}`:""}`).join('\n')}\n${priceLabel()} · ${priceTotal()}`;try{await navigator.clipboard.writeText(txt);b.textContent='Скопировано'}catch{prompt('Скопируйте список:',txt)}}});
app.addEventListener('input',e=>{if(e.target.id==='search'){s.search=e.target.value;document.querySelector('#foodchips').innerHTML=foodChips(s.step===10?'dislikes':s.step===11?'likes':'pantry')}if(['budgetrange','budgetnum'].includes(e.target.id)){let n=Number(e.target.value);s.budget=Math.max(100,Math.min(100000,n||100));if(e.target.id==='budgetrange')document.querySelector('#budgetnum').value=s.budget;else document.querySelector('#budgetrange').value=s.budget;save()}});
app.addEventListener('change',e=>{if(e.target.dataset.check){let k=e.target.dataset.check;s.checked=e.target.checked?[...new Set([...s.checked,k])]:s.checked.filter(x=>x!==k);render()}});render();
</script></body></html>
