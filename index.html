 app.innerHTML=head(false)+'<main><div class="hero"><div class="plate">✳</div></div><h1>Составляем меню</h1><p>Анализируем анкету, подбираем рецепты, проверяем состав и стоимость корзины.</p><div class="hint" role="status">Подбираем блюда и рассчитываем покупки…</div></main>';
 try{
 let result=await requestAI();
 if(result.cost>s.budget){try{const retry=await requestAI('Первый план стоил '+Math.round(result.cost)+' ₽ при бюджете '+s.budget+' ₽. Предложи более экономный полноценный вариант; не уменьшай порции искусственно.');if(retry.cost<result.cost)result=retry}catch{}}
 recipes.splice(baseCount);recipes.push(...result.fresh);s.aiRecipes=result.fresh;s.plan=result.plan;s.source='ai';s.aiNote=result.note;s.checked=[];s.error='';s.view='shopping';
 }catch(e){const err=generate();if(err){s.error='Не удалось составить меню. '+err;s.view='quiz';s.step=LAST_STEP;}}
 finally{aiBusy=false;render();window.scrollTo(0,0)}
}

function head(back=true){return `<header>${back?'<button class="back" data-act="back" aria-label="Назад">‹</button>':'<span></span>'}<div class="brand"><span class="logo">✳</span>ладно.</div><small>${s.view==='quiz'&&s.step?`${s.step} / ${LAST_STEP}`:''}</small></header>`}
function footer(label,disabled=false){return `<div class="footer"><button class="primary" data-act="next" ${disabled?'disabled':''}>${label}</button></div>`}
const choice=(key,val,label,icon='',selected=false,desc='')=>`<button class="choice ${selected?'on':''}" data-act="pick" data-key="${key}" data-val="${esc(val)}" aria-pressed="${selected}">${icon?`<span class="emoji">${icon}</span>`:''}<span>${esc(label)}${desc?`<small style="display:block;margin-top:5px">${esc(desc)}</small>`:''}</span></button>`;
const chip=(key,val,label,on)=>`<button class="chip ${on?'on':''}" data-act="pick" data-key="${key}" data-val="${esc(val)}" aria-pressed="${on}">${esc(label)}</button>`;
function options(key,vals,wide=false){return `<div class="${wide?'wide':'grid'}">${vals.map(v=>{let [label,icon,desc]=Array.isArray(v)?v:[v];return choice(key,label,label,icon,Array.isArray(s[key])?s[key].includes(label):s[key]===label,desc)}).join('')}</div>`}
const title=(t,d)=>`<h1>${t}</h1>${d?`<p>${d}</p>`:'<div style="height:18px"></div>'}`;
function quiz(){let content='',disabled=false,label='Продолжить';switch(s.step){
case 0:content=`<div class="welcome"><div class="eyebrow">План питания</div><h1>Привет!<br>Что будем есть<br>на этой неделе?</h1><p>Меню и покупки под ваш бюджет.</p><div class="welcome-mark" aria-hidden="true">✳</div>${s.plan.length?'<button class="secondary" style="width:100%;margin-top:18px" data-act="view" data-val="shopping">Моя корзина</button>':''}</div>`;label='Начать';break;
case 1:content=title('Где покупаете продукты?','Можно выбрать несколько магазинов.')+`<div class="wide">${stores.map(v=>choice('storeChoices',v,v,'',hasStore(v))).join('')}</div><p style="font-size:12px;margin-top:16px">Цены ориентировочные, могут отличаться от цен на кассе.</p>`;disabled=!s.storeChoices.length;break;
case 2:content=title('Кто будет есть?','')+['adults','children'].map((k,i)=>`<div class="panel row"><div><b>${i?'Дети':'Взрослые'}</b><br><small>${i?'До 18 лет':'18 лет и старше'}</small></div><div class="counter"><button data-act="count" data-key="${k}" data-val="-1" aria-label="Уменьшить">−</button><b>${s[k]}</b><button data-act="count" data-key="${k}" data-val="1" aria-label="Увеличить">+</button></div></div>`).join('')+`<div class="hint">${portions()} порций на приём пищи. Для простоты порции одинаковые; детские потребности зависят от возраста.</div>`;disabled=!portions();break;
case 3:content=title('Какие приёмы пищи?','')+options('meals',[['Завтрак','🥣','Начало дня'],['Обед','🍲','Сытная середина дня'],['Ужин','🍝','Вечер всей семьёй'],['Перекусы','🍎','Между приёмами пищи']],true);disabled=!s.meals.length;break;
case 4:content=title('В какие дни готовите?','')+`<div class="days">${days.map((v,i)=>chip('days',i,v,s.days.includes(i))).join('')}</div><div class="hint">Дней в плане: ${s.days.length}</div>`;disabled=!s.days.length;break;
case 5:content=title('Что есть на кухне?','')+options('equipment',[['Плита','🍳'],['Духовка','♨'],['Микроволновка','▣'],['Блендер','◉'],['Мультиварка','◒'],['Аэрогриль','◈']]);break;
case 6:content=title('Как вы питаетесь?','')+options('diet',[['Без ограничений','🍽'],['Вегетарианское','🥕'],['Веганское','🌱'],['Без мяса','🐟'],['Низкоуглеводное','🥦'],['Высокобелковое',''],['Высокоуглеводное',''],['Сбалансированное','']]);break;
case 7:content=title('Что вам ближе?','')+options('style',[['Разнообразие','✳','Меньше повторений'],['Быстро и просто','⏱','Предпочтение быстрым рецептам']],true);break;
case 8:content=title('Какая у вас цель?','')+options('goal',[['Обычное питание','','На каждый день'],['Поддержание веса',''],['Набор мышечной массы','','Больше энергии и белка'],['Спортивное питание','','Энергия для тренировок'],['Снижение веса','','Для взрослых'],['Восстановление после тренировок','']],true);break;
case 9:content=title('Есть аллергии?','Исключим ингредиенты, содержащие выбранные аллергены. Проверяйте этикетки и следы аллергенов самостоятельно.')+`<div class="chips">${chip('allergies','none','Нет аллергий',!s.allergies.length)}${Object.keys(allergens).map(v=>chip('allergies',v,v,s.allergies.includes(v))).join('')}</div>`;break;
case 10:case 11:{let k=s.step===10?'dislikes':'likes';content=title(s.step===10?'Что не любите?':'Что любите?',s.step===10?'Исключим эти продукты.':'Учтём при подборе блюд.')+`<input type="search" id="search" placeholder="Найти продукт" value="${esc(s.search)}"><div class="chips" id="foodchips">${foodChips(k)}</div>`+customPreference(k);label='Продолжить';break}
case 12:content=title('Что добавить в рацион?','Постоянные покупки на каждую неделю.')+`<div class="panel">${extraItems().length?extraItems().map(x=>`<div class="row" style="padding:10px 0"><b>${esc(x.name)}</b><small>${qty(x.qty,x.unit)}</small></div>`).join(''):'<p style="margin:0">Например: шоколад, кофе или йогурт.</p>'}<button class="secondary" style="width:100%;margin-top:12px" data-act="extras-open">+ Добавить продукт</button></div>`;label=extraItems().length?'Продолжить':'Пропустить';break;
case 13:content=title('Что уже есть дома?','Эти продукты не нужно покупать.')+`<input type="search" id="search" placeholder="Найти продукт" value="${esc(s.search)}"><div class="chips" id="foodchips">${foodChips('pantry')}</div>`;label=s.pantry.length?'Продолжить':'Пропустить';break;
case 14:content=title('Бюджет на неделю','Настройте максимальную сумму на покупки.')+`<div class="row" style="justify-content:flex-start"><input class="budgetInput" id="budgetnum" type="number" min="100" max="100000" step="100" value="${s.budget}" aria-label="Бюджет в рублях"><b style="font-size:32px">₽</b></div><input type="range" id="budgetrange" min="100" max="${Math.max(20000,s.budget)}" step="100" value="${s.budget}"><div class="row muted"><small>100 ₽</small><small>${money(Math.max(20000,s.budget))}</small></div><div class="stats" style="margin-top:24px"><div class="panel"><small>Всего порций</small><b>${slots()*portions()}</b></div><div class="panel"><small>На порцию</small><b id="per">${money(s.budget/Math.max(1,slots()*portions()))}</b></div></div><div class="hint">${esc(storeLabel())} · ${portions()} чел. · ${s.days.length} дней. Стоимость пока ориентировочная.</div>${s.error?`<div class="error">${esc(s.error)}</div>`:''}`;label='Собрать меню';break;
}app.innerHTML=head(s.step>0)+(s.step?`<div class="progress"><i style="width:${s.step/LAST_STEP*100}%"></i></div>`:'')+`<main>${content}</main>`+footer(label,disabled)}
function foodChips(k){return Object.entries(food).filter(([id,f])=>!id.startsWith('extra_')&&f[0].toLowerCase().includes(s.search.toLowerCase())).map(([id,f])=>chip(k,id,f[0],s[k].includes(id))).join('')||'<small>Ничего не найдено</small>'}
function customPreference(k){
 const field=k==='dislikes'?'customDislikes':'customLikes';
 return '<div style="margin-top:24px"><b>Свой продукт</b><div class="row" style="margin-top:8px"><input id="custom-pref" class="extraField" maxlength="70" style="margin:0;min-width:0" placeholder="Например, авокадо"><button class="secondary" data-act="pref-add" data-key="'+k+'">+</button></div><div class="chips" style="margin-top:12px">'+s[field].map((x,i)=>'<button class="chip on" data-act="pref-remove" data-key="'+k+'" data-val="'+i+'">'+esc(x)+' ×</button>').join('')+'</div></div>'
}
function preferenceAction(a,k,v){
 if(!['likes','dislikes'].includes(k))return;
 const field=k==='dislikes'?'customDislikes':'customLikes',other=k==='dislikes'?'customLikes':'customDislikes';
 if(a==='pref-remove')s[field].splice(Number(v),1);
 else{
 const val=document.querySelector('#custom-pref')?.value.trim();if(!val||!norm(val)||s[field].length>=30)return;
 const match=Object.keys(food).find(id=>norm(food[id][0])===norm(val)&&!id.startsWith('extra_'));
 if(match){if(!s[k].includes(match))s[k].push(match);const opposite=k==='likes'?'dislikes':'likes';s[opposite]=s[opposite].filter(x=>x!==match)}
 else if(!s[field].some(x=>norm(x)===norm(val)))s[field].push(val.slice(0,70));
 s[other]=s[other].filter(x=>norm(x)!==norm(val));
 }render()
}
function navigation(){return `<div class="nav">${[['plan','Меню'],['shopping','Покупки'],['extras','Продукты'],['settings','Настройки']].map(([v,l])=>`<button class="${s.view===v?'active':''}" data-act="view" data-val="${v}">${l}</button>`).join('')}</div>`}
function plan(){let cost=total(),delta=s.budget-cost;app.innerHTML=head(false)+`<main style="padding-top:5px">${navigation()}<div class="eyebrow">Ваш план питания</div><h1>Неделя готова.</h1>${s.source==='local'&&API_BASE?'<p style="font-size:12px">Меню подобрано из базовых рецептов.</p>':''}<div class="summary"><small>${allCatalogPrices()?'Корзина по выбранным товарам':'Ориентировочная корзина'}</small><div class="amount">${priceTotal()}</div><b>${missingPrices()?'Итог не определён: '+missingPrices()+' поз. без цены':delta>=0?'Остаток бюджета: '+money(delta):'Превышение бюджета: '+money(-delta)}</b><p style="font-size:13px;margin:7px 0 15px">${esc(storeLabel())} · ${portions()} чел. · ${basket().length} позиций</p><button class="primary" data-act="view" data-val="shopping">Список покупок →</button></div>${delta<0?'<div class="error">Не удалось уложиться в бюджет с текущими ограничениями. Увеличьте бюджет или измените настройки.</div>':''}<div class="row"><small>${esc(priceLabel())}</small><button class="link" data-act="ai-generate">Обновить меню</button></div>${[...s.days].sort((a,b)=>a-b).map(day=>`<h2>${fullDays[day]}</h2>${s.plan.map((p,i)=>p.day!==day?'':`<article class="meal"><div class="mealpic">${recipes[p.id].icon}</div><div class="mealinfo"><small>${p.meal} · ${recipes[p.id].time} мин</small><b>${recipes[p.id].name}</b><button class="link" data-act="recipe" data-val="${i}">Рецепт</button><button class="link" data-act="swap" data-val="${i}">Заменить ↻</button></div></article>`).join('')}`).join('')}<div class="hint">План не проверен на соответствие индивидуальным нормам питания. Для детей и специальных диет учитывайте возраст и рекомендации специалиста.</div></main>`}
function shopping(){const b=basket(),cats=[...new Set(b.map(x=>x.cat))];app.innerHTML=head(false)+`<main style="padding-top:5px">${navigation()}<div class="eyebrow">Ваш план на неделю</div><h1>Корзина готова.</h1>${s.source==='local'?'<p style="font-size:12px">Меню подобрано из базовых рецептов.</p>':''}<div class="summary"><small>${esc(storeLabel())} · ${b.length} позиций</small><div class="amount">${priceTotal()}</div><b>${missingPrices()?'Не указаны цены: '+missingPrices()+' поз.':total()>s.budget?'Выше бюджета на '+money(total()-s.budget):'Остаток бюджета: '+money(s.budget-total())}</b><div style="margin-top:12px"><button class="secondary" style="width:100%" data-act="view" data-val="plan">Посмотреть меню на неделю →</button></div><small style="display:block;margin-top:12px">Куплено ${b.filter(x=>s.checked.includes(x.k)).length} из ${b.length}</small><div class="progress" style="margin:12px 0 0"><i style="width:${100*b.filter(x=>s.checked.includes(x.k)).length/Math.max(1,b.length)}%"></i></div></div><p style="font-size:13px">${esc(priceLabel())}.</p>${cats.map(cat=>`<h2>${cat}</h2>${b.filter(x=>x.cat===cat).map(x=>`<label class="grocery ${s.checked.includes(x.k)?'done':''}"><input type="checkbox" data-check="${x.k}" ${s.checked.includes(x.k)?'checked':''}><span><b class="itemname">${esc(x.name)}</b><br><small>Нужно ${qty(x.qty,x.unit)} · купить ${qty(x.buy,x.unit)}${x.product?` · ${x.packs} уп.`:""}</small>${x.product?.url?`<br><a href="${esc(x.product.url)}" target="_blank" rel="noopener noreferrer">Открыть товар →</a>`:""}</span><span class="price">${x.price===null?'Уточнить цену':money(x.price)}</span></label>`).join('')}`).join('')}${orderPanel()}<button class="secondary" style="margin-top:24px;width:100%" data-act="copy">Скопировать список</button><button class="link" data-act="clearchecks">Сбросить отметки</button></main>`}
const qty=(n,u)=>n>=1000&&u!=='шт'?`${(n/1000).toLocaleString('ru-RU',{maximumFractionDigits:2})} ${u==='мл'?'л':'кг'}`:`${n} ${u}`;
let detail=0;function recipe(){const p=s.plan[detail],r=recipes[p.id];app.innerHTML=head()+`<main><div class="detailpic">${r.icon}</div><div class="eyebrow">${p.meal} · ${r.time} минут</div><h1>${r.name}</h1><p>На ${portions()} порций</p><h2>Ингредиенты</h2><div class="panel">${Object.entries(r.ingredients).map(([k,v])=>`<div class="row" style="padding:8px 0"><span>${food[k][0]}${s.pantry.includes(k)?' · дома':''}</span><b>${qty(v*portions(),food[k][4]||'г')}</b></div>`).join('')}</div><h2>Приготовление</h2><ol class="steps">${r.method.split('. ').map(t=>`<li>${esc(t.replace(/\.$/,''))}.</li>`).join('')}</ol><button class="secondary" data-act="view" data-val="plan">Вернуться к меню</button></main>`}
function settingsScreen(){app.innerHTML=head(false)+'<main>'+navigation()+'<h1>Настройки</h1><button class="secondary" style="width:100%;margin:8px 0" data-act="view" data-val="quiz">Изменить анкету</button><button class="secondary" style="width:100%;margin:8px 0" data-act="extras-open">Мои продукты</button>'+ (hasStore('Пятёрочка')?'<details style="margin-top:24px"><summary>Расширенные настройки магазина</summary>'+catalogPanel()+'</details>':'')+'<p style="font-size:13px;margin-top:20px">Цены ориентировочные, если не подключён каталог магазина. Для составления меню данные анкеты могут обрабатываться внешним сервисом. Проверяйте состав продуктов при аллергиях.</p></main>'}
function render(){save();if(s.view==='settings'){settingsScreen();return}if(s.view==='extras'){extrasScreen();return}if(s.view==='catalog'){catalogScreen();return}if(s.view==='plan'&&s.plan.length)plan();else if(s.view==='shopping'&&s.plan.length)shopping();else if(s.view==='recipe'&&s.plan[detail])recipe();else{s.view='quiz';quiz()}}
function swap(i){const old=s.plan[i], candidates=recipes.map((r,id)=>({...r,id})).filter(r=>r.type===old.meal&&r.id!==old.id&&allowed(r)).map(r=>{const p=s.plan.map((x,j)=>i===j?{...x,id:r.id}:x);return{p,c:total(p),repeats:p.filter(x=>x.id===r.id).length}}).sort((a,b)=>(a.c>s.budget)-(b.c>s.budget)||a.repeats-b.repeats||a.c-b.c);if(!candidates.length){alert('Других подходящих блюд нет. Измените ограничения.');return}if(candidates[0].c>s.budget&&!confirm('Замена выйдет за бюджет. Продолжить?'))return;s.plan=candidates[0].p;s.checked=[];render()}
app.addEventListener('click',async e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,k=b.dataset.key,v=b.dataset.val;if(aiBusy||catalogBusy)return;if(a.startsWith('extras-')){extrasAction(a,v);return}if(a.startsWith('catalog-')){await catalogAction(a,v);return}if(a==='ai-generate'){await generateAI();return}if(a==='local-generate'){let err=generate();if(err){s.error=err;render()}else window.scrollTo(0,0);return}if(a==='pref-add'||a==='pref-remove'){preferenceAction(a,k,v);return}if(a==='pick'){if(Array.isArray(s[k])){let x=k==='days'?Number(v):v;if(k==='allergies'&&x==='none')s[k]=[];else s[k]=s[k].includes(x)?s[k].filter(y=>y!==x):[...s[k],x]}else s[k]=v;if(k==='storeChoices')s.store=s.storeChoices[0]||'';if(k==='likes')s.dislikes=s.dislikes.filter(x=>!s.likes.includes(x));if(k==='dislikes')s.likes=s.likes.filter(x=>!s.dislikes.includes(x));render()}if(a==='count'){s[k]=Math.min(20,Math.max(0,s[k]+Number(v)));render()}if(a==='next'){if(s.step===10||s.step===11){const input=document.querySelector('#custom-pref');if(input?.value.trim())preferenceAction('pref-add',s.step===10?'dislikes':'likes')}if(s.step<LAST_STEP){s.step++;s.search='';render();window.scrollTo(0,0)}else{await generateAI()}}if(a==='back'){if(s.view==='settings'){s.view=s.plan.length?'plan':'quiz';render();return}if(s.view==='extras'){extrasAction('extras-done');return}if(s.view==='catalog'){s.view='settings'}else if(s.view==='recipe')s.view='plan';else if(s.view==='quiz')s.step=Math.max(0,s.step-1);else s.view='plan';s.search='';render();window.scrollTo(0,0)}if(a==='view'){if(v==='extras'){extrasAction('extras-open');return}s.view=v;if(v==='quiz')s.step=1;render();window.scrollTo(0,0)}if(a==='recipe'){detail=Number(v);s.view='recipe';render();window.scrollTo(0,0)}if(a==='swap')swap(Number(v));if(a==='regenerate'){await generateAI()}if(a==='clearchecks'){s.checked=[];render()}if(a==='copy'){const txt=`Список покупок · ${storeLabel()}\n${basket().map(x=>`${s.checked.includes(x.k)?'✓':'□'} ${x.name} — ${qty(x.buy,x.unit)}${x.product?` (${x.packs} уп.) ${x.product.url||""}`:""}`).join('\n')}\n${priceLabel()} · ${priceTotal()}`;try{await navigator.clipboard.writeText(txt);b.textContent='Скопировано'}catch{prompt('Скопируйте список:',txt)}}});
app.addEventListener('input',e=>{if(e.target.id==='search'){s.search=e.target.value;document.querySelector('#foodchips').innerHTML=foodChips(s.step===10?'dislikes':s.step===11?'likes':'pantry')}if(['budgetrange','budgetnum'].includes(e.target.id)){let n=Number(e.target.value);s.budget=Math.max(100,Math.min(100000,n||100));if(e.target.id==='budgetrange')document.querySelector('#budgetnum').value=s.budget;else document.querySelector('#budgetrange').value=s.budget;document.querySelector('#per').textContent=money(s.budget/Math.max(1,slots()*portions()));save()}});
app.addEventListener('change',e=>{if(e.target.dataset.check){let k=e.target.dataset.check;s.checked=e.target.checked?[...new Set([...s.checked,k])]:s.checked.filter(x=>x!==k);render()}});render();
</script></body></html>
